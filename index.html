const all=rows.flatMap(([year,str])=>str.split('|').map((name,i)=>({id:year+'-'+i,year,name})));const key='anime-timeline-2006-2025-v1';let checked=new Set;try{checked=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch{};const tbody=document.querySelector('tbody');let query='';function draw(){tbody.innerHTML='';for(let [year,str] of rows){let tr=document.createElement('tr');let y=document.createElement('td');y.className='year';y.textContent=year;tr.append(y);str.split('|').forEach((name,i)=>{let id=year+'-'+i,td=document.createElement('td'),b=document.createElement('button');b.type='button';b.className='cell'+(checked.has(id)?' watched':'')+(query&&name.toLowerCase().includes(query)?' match':'')+(query&&!name.toLowerCase().includes(query)?' dim':'');b.textContent=name;b.title=year+' · '+name+'（点击切换）';b.setAttribute('aria-pressed',checked.has(id));b.onclick=()=>{checked.has(id)?checked.delete(id):checked.add(id);save();draw()};td.append(b);tr.append(td)});tbody.append(tr)}const count=all.filter(v=>checked.has(v.id)).length;document.getElementById('count').textContent=count;document.getElementById('total').textContent=all.length;let p=Math.round(count/all.length*100);document.getElementById('percent').textContent=p+'% 已点亮';document.getElementById('progress').style.width=p+'%'}function save(){try{localStorage.setItem(key,JSON.stringify([...checked]))}catch{}}let timer;function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),2400)}document.querySelector('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();draw()};document.querySelector('#reset').onclick=()=>{if(confirm('确定要清空所有已涂色的格子吗？')){checked.clear();save();draw();toast('已清空')}};function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}document.querySelector('#export').onclic
